name: Release zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build front end
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package
        run: |
          mkdir -p /tmp/pkg/visual-editor
          rsync -a --exclude='.git' --exclude='.github' --exclude='frontend' --exclude='docs' --exclude='tests' --exclude='phpunit.xml.dist' --exclude='*.map' ./ /tmp/pkg/visual-editor/
          (cd /tmp/pkg && zip -qr $GITHUB_WORKSPACE/visual-editor.zip visual-editor)
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" visual-editor.zip --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" visual-editor.zip --clobber
